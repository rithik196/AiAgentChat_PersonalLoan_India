version: "3.9"
 
networks:
  my-network:

volumes:
  postgres-data:
  redis-data:
  mssql-data: 
  mongo-data:
  aiagent-frontend-data:
  aiagent-backend-data:
  aiagent-agent-data:
  aiagent-workflow-data:

services:
  postgres:
      image: postgres:15
      container_name: postgres
      restart: unless-stopped
      env_file:
        - .env
      ports:
        - "5432:5432"
      volumes:
        - postgres-data:/var/lib/postgresql/data
      networks:
        - my-network
  redis:
      image: redis:7-alpine
      container_name: redis
      restart: unless-stopped
      ports:
        - "6379:6379"
      volumes:
        - redis-data:/data
      networks:
        - my-network
  mongodb:
      image: mongo:7
      container_name: mongodb
      restart: unless-stopped
      ports:
        - "27017:27017"
      volumes:
        - mongo-data:/data/db
      networks:
        - my-network
  sqlserver:
      image: mcr.microsoft.com/mssql/server:2022-latest
      container_name: sqlserver
      restart: unless-stopped
      env_file:
        - .env
      ports:
        - "1433:1433"
      volumes:
        - mssql-data:/var/opt/mssql
      networks:
        - my-network
  temporal:
      image: temporalio/auto-setup:latest
      container_name: temporal
      restart: unless-stopped
      env_file:
        - .env
      ports:
        - "7233:7233"
        - "8080:8080"
      depends_on:
        - postgres
      networks:
        - my-network
  aiagent-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: aiagent-frontend
    ports:
      - "3000:3000"
    networks:
      - my-network
    env_file:
      - .env
    volumes:
      - aiagent-frontend-data:/app/data
  aiagent-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: aiagent-backend
    ports:
      - "8000:8000"
    networks:
      - my-network
    env_file:
      - .env
    depends_on:
      - mongodb
    volumes:
      - aiagent-backend-data:/app/data
  aiagent-agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    container_name: aiagent-agent
    networks:
      - my-network
    env_file:
      - .env
    depends_on:
      - mongodb
    volumes:
      - aiagent-agent-data:/app/data

  aiagent-workflow:
    build:
      context: .
      dockerfile: workflow/Dockerfile
    container_name: aiagent-workflow
    networks:
      - my-network
    env_file:
      - .env
    volumes:
      - aiagent-workflow-data:/app/data
